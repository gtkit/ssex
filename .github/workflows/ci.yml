name: CI

on:
  push:
    branches: [main]
    # 也在 tag 上跑：发版脚本推 tag 后立即有一份对应版本的 CI 记录
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # action 固定到 commit SHA：版本 tag 可被移动，SHA 不能
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Tidy check
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # 固定版本：latest 会随上游发布而变，构建结果不可复现。
      # 与本地开发所用版本保持一致。
      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v2.11.4

      # 用 go install 固定版本，而不是依赖第三方 action 的参数语义
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Gosec
        run: gosec -quiet ./...

      - name: Test
        run: go test -race -count=1 -timeout=8m ./...

      # 与发版脚本的 COVERAGE_MIN 保持一致：低于门槛要让 CI 红，而不是只打印
      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          cov=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          awk -v c="$cov" 'BEGIN { if (c+0 < 80) { printf "✗ 覆盖率 %.1f%% < 80%%\n", c+0; exit 1 } }'

      - name: Benchmark
        run: go test -bench=. -benchmem -run='^$' ./...

      - name: Fuzz
        run: |
          go test -fuzz=FuzzDecode -fuzztime=30s -run='^$' ./...
          go test -fuzz=FuzzRoundTrip -fuzztime=30s -run='^$' ./...

  # gin 兼容性回归：独立模块，因此主模块的依赖清单里没有 gin
  gincompat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Tidy check
        working-directory: gincompat
        run: go mod tidy -diff

      - name: Vet
        working-directory: gincompat
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v2.11.4
          working-directory: gincompat

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Gosec
        working-directory: gincompat
        run: gosec -quiet ./...

      - name: Test
        working-directory: gincompat
        run: go test -race -count=1 -timeout=5m ./...
